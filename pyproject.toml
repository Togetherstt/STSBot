[project]
name = "stsbot"
version = "0.1.0"
description = "Standalone Slay the Spire 2 card guess bot plugin based on NoneBot2."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0,<2.6.0",
    "nonebot-adapter-onebot>=2.4.6,<2.5.0",
    "nb-cli>=1.4.2,<2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.nonebot]
plugins = []
plugin_dirs = ["src/plugins"]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
builtin_plugins = []
